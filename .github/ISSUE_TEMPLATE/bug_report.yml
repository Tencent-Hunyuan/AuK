name: Bug report
description: Report a reproducible problem in AuK
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AuK. Please provide a minimal, reproducible report.
        Remove tokens, private URLs, personal speech, and confidential data before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I read the contributing guide and reduced the report to the smallest reproducible case.
          required: true
        - label: I removed credentials, private data, and audio that I do not have permission to share.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the failure and its impact in a few sentences.
      placeholder: What went wrong, and what task were you trying to complete?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or dependencies
        - Model or checkpoint loading
        - Speech generation
        - Speech or audio editing
        - Audio input or output
        - Gradio interface
        - ModelScope download or deployment
        - Performance or memory
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: AuK variant
      options:
        - AuK (Base)
        - AuK-Flash
        - Both variants
        - Unknown or not applicable
    validations:
      required: true

  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint source and revision
      description: Provide the repository and exact revision, commit, or file version. Enter N/A when not applicable.
      placeholder: "Tencent-Hunyuan/AuK, revision: ..."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include every item that applies.
      value: |
        - OS:
        - Python:
        - PyTorch:
        - CUDA:
        - GPU and VRAM:
        - NVIDIA driver:
        - Gradio:
        - Installation method:
        - Other relevant packages:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the exact steps, smallest safe input, and any required configuration.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the complete command. GitHub will format it as a code block.
      render: shell
    validations:
      required: true

  - type: textarea
    id: audio
    attributes:
      label: Audio details
      description: If audio is involved, provide format, sample rate, channels, duration, and a non-sensitive description. Enter N/A otherwise.
      placeholder: "WAV, 24 kHz, mono, 4.2 seconds, synthetic speech"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and traceback
      description: Include the complete relevant output after removing secrets and private paths.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did the same workflow succeed with an earlier version?
      options:
        - "Yes"
        - "No"
        - Unknown
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add profiling results, screenshots, related issues, or other useful evidence.

  - type: checkboxes
    id: terms
    attributes:
      label: Submission agreement
      options:
        - label: I confirm that this report follows the Code of Conduct and contains no sensitive information.
          required: true
