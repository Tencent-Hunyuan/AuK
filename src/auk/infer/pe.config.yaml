        - 把语速{value}。
        - 将音频的语速{value}。
        - 帮我把这段话的语速{value}。
        - 请把说话速度{value}。
        - 将这段语音的语速{value}吧。
        - 麻烦把语速{value}。
        - 请将语速{value}一下。
        - 把这段录音的语速{value}。
        - 将音频语速{value}即可。
        - 需要把语速{value}。
        - 请帮我将这段语音的语速{value}。
        - 把说话的速度{value}。
        - 将这段话的语速{value}。
        - 请把音频语速{value}。
        - 把语速给我{value}。
        - 将语速{value},谢谢。
        - 请将该录音的语速{value}。
        - 把这段语音语速{value}一下。
        - 将播放语速{value}。
        - 请把这段音频的语速{value}。
        - 语速{value}。
        - 帮忙把语速{value}。
        - 将说话语速{value}。
        - 请将这段录音语速{value}。
        - 把音频的语速{value}吧。
